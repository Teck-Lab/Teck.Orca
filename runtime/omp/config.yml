setupVersion: 2
startup:
  setupWizard: false
theme:
  dark: titanium
  light: light
symbolPreset: nerd # unicode, nerd, ascii
statusLine:
  preset: nerd # default, minimal, compact, full, nerd, ascii, custom
  separator: powerline-thin
  transparent: false
  showHookStatus: true

terminal:
  showImages: true
images:
  autoResize: true
  blockImages: false
tui:
  hyperlinks: auto # off, auto, always
modelRoles:
  default: omniroute/teck-orchestrator
  plan: omniroute/teck-orchestrator
  slow: omniroute/teck-researcher
  advisor: omniroute/teck-advisor
  vision: omniroute/teck-orchestrator
  task: omniroute/teck-executor
  designer: omniroute/teck-executor
  smol: omniroute/teck-fast-tool
  tiny: omniroute/teck-fast-tool
  commit: omniroute/teck-fast-text
  memory: omniroute/teck-fast-tool
  judge: omniroute/teck-judge
advisor:
  enabled: false # Coordinator/reviewer stay unadvised; implementation-worker opts in via its agent preset.
goal:
  enabled: true
  statusInFooter: true
  continuationModes: [interactive]
todo:
  enabled: true
enabledModels:
  - omniroute/teck-orchestrator
  - omniroute/teck-advisor
  - omniroute/teck-executor
  - omniroute/teck-fast-tool
  - omniroute/teck-fast-text
  - omniroute/teck-judge
  - omniroute/teck-researcher
cycleOrder: [smol, default, task]
retry:
  enabled: true
  maxRetries: 3
  maxDelayMs: 30000
  modelFallback: false
providers:
  # web_search is supplied by the MCPHub extension; this is the native provider order.
  webSearchOrder: [searxng]
  fetch: native # Bare URL reads use self-hosted Firecrawl through the MCPHub extension.
  maxInFlightRequests:
    omniroute: 4
task:
  isolation:
    enabled: false
github:
  enabled: true
  cache:
    enabled: true
memory:
  backend: hindsight
hindsight:
  apiUrl: https://hindsight-api.tecklab.dk
  bankId: teck
  scoping: per-project-tagged
  autoRecall: true
  recallTimeoutMs: 90000
  autoRetain: true
  mentalModelAutoSeed: false
# HINDSIGHT_API_TOKEN comes from the Docker-managed HINDSIGHT_API_KEY placeholder.
autolearn:
  enabled: true


