apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: keycloak-realm-source
    files:
      - Chart.yaml
      - realm-template.yaml
      - realm.yaml=../../../in-cluster/security/keycloak/development-realm.yaml
      - gateway-client.yaml=../../../in-cluster/security/keycloak/clients/development/teck-public-gateway-client.yaml
generatorOptions:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
