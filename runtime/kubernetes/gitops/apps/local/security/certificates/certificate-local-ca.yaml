apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  isCA: true
  commonName: Teck local development CA
  secretName: local-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: local-selfsigned
    kind: Issuer
