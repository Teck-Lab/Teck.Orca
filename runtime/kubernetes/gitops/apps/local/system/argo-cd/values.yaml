dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    server.insecure: false
  cm:
    kustomize.buildOptions: --enable-helm --load-restrictor LoadRestrictionsNone
server:
  service:
    type: ClusterIP
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
