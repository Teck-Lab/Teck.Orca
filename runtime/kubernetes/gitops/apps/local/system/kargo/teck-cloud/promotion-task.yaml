apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: local-worktree-release
spec:
  vars:
    - name: appRepo
    - name: gitopsRepo
    - name: worktree
    - name: application
  steps:
    - uses: git-clone
      config:
        repoURL: ${{ vars.gitopsRepo }}
        checkout:
          - branch: main
            path: ./gitops
    - uses: yaml-update
      config:
        path: ./gitops/apps/local/teck-cloud/teck-cloud-core/worktrees/${{ vars.worktree }}/promotion/kustomization.yaml
        updates:
          - key: resources.0
            value: ${{ vars.appRepo }}//promotion?ref=${{ commitFrom(vars.appRepo).ID }}
    - uses: git-commit
      as: commit
      config:
        path: ./gitops
        message: "chore(local): promote ${{ vars.worktree }}"
    - uses: git-push
      config:
        path: ./gitops
    - uses: argocd-update
      config:
        apps:
          - name: ${{ vars.application }}
            namespace: argocd
            sources:
              - repoURL: ${{ vars.gitopsRepo }}
                desiredRevision: ${{ task.outputs.commit.commit }}
      retry:
        errorThreshold: 3
        timeout: 6m
