kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/lib/teck-kubernetes/kmsg
        containerPath: /dev/kmsg
        readOnly: true
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
        protocol: TCP
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 16443
